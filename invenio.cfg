# Remote ("R") file transfers - files stay on S3 and downloads are redirected (302)
# to the remote URL. RemoteTransfer checks only the URL's host (netloc), not the
# bucket/path. RemoteTransfer is registered in RECORDS_RESOURCES_TRANSFERS by default.
RECORDS_RESOURCES_FILES_ALLOWED_REMOTE_DOMAINS = ["s3.nrp1.du.cesnet.cz"]

# TODO: remove as soon as oarepo-rdm delegates file services to model services.
# oarepo-rdm (8.6.1) does not delegate `records_service.files` / `draft_files`
# to the specialized model services, so the UI file download
# (/records/<pid>/files/<key>) is checked against RDM_PERMISSION_POLICY, not the
# per-model policy (e.g. FramPermissionPolicyMixin). Allow remote ("R") files here.
from invenio_rdm_records.services.permissions import RDMRecordPermissionPolicy
from invenio_records_permissions.generators import SameAs, SystemProcess
from invenio_records_resources.services.files.generators import IfTransferType
from invenio_records_resources.services.files.transfer import (
    LOCAL_TRANSFER_TYPE,
    MULTIPART_TRANSFER_TYPE,
    REMOTE_TRANSFER_TYPE,
)


class RemoteTransferRDMPermissionPolicy(RDMRecordPermissionPolicy):
    """RDM permission policy allowing remote (R) file transfers."""

    can_get_content_files = [
        IfTransferType(LOCAL_TRANSFER_TYPE, SameAs("can_read_files")),
        IfTransferType(REMOTE_TRANSFER_TYPE, SameAs("can_read_files")),
        SystemProcess(),
    ]
    can_draft_create_files = [
        IfTransferType(LOCAL_TRANSFER_TYPE, SameAs("can_review")),
        IfTransferType(MULTIPART_TRANSFER_TYPE, SameAs("can_review")),
        IfTransferType(REMOTE_TRANSFER_TYPE, SameAs("can_review")),
        SystemProcess(),
    ]
    can_draft_commit_files = [
        IfTransferType(LOCAL_TRANSFER_TYPE, SameAs("can_review")),
        IfTransferType(MULTIPART_TRANSFER_TYPE, SameAs("can_review")),
        IfTransferType(REMOTE_TRANSFER_TYPE, SameAs("can_review")),
        SystemProcess(),
    ]
    can_draft_get_content_files = [
        IfTransferType(LOCAL_TRANSFER_TYPE, SameAs("can_draft_read_files")),
        IfTransferType(REMOTE_TRANSFER_TYPE, SameAs("can_draft_read_files")),
        SystemProcess(),
    ]


RDM_PERMISSION_POLICY = RemoteTransferRDMPermissionPolicy
