# Definition of metadata for particles. Please do not add ccmm model here,
# add the ccmm_preset instead.
Metadata:
  properties:

    experiment:
      type: vocabulary
      vocabulary-type: experiments
      label:
        en: Experiment
        cs: Experiment

    recid:
      type: int
      label:
        en: Record ID

    file_types:
      type: array
      label:
        en: File types
        cs: Typy souborů
      items:
        type: keyword

    collision_information:
      type: object
      label:
        en: Collision Information
      properties:
        energy:
          type: keyword
          label:
            en: Center-of-Mass Energy
        energy_min:
          type: float
          label:
            en: Lowest Center-of-Mass Energy
        energy_max:
          type: float
          label:
            en: Highest Center-of-Mass Energy
        type:
          # might be a dictionary, if needed
          type: keyword
          label:
            en: Collision Type
          enum:
            - e+e-
    
    category:
      type: vocabulary
      vocabulary-type: particle_category
      label:
        en: Category

    number_of_events:
      type: int
      label:
        en: Number of Events
      description: >
        Uses a custom RangeQueryFacet (see facets.py) instead of the
        default TermsFacet so the UI can filter by a "min..max" range
        rather than exact-match only.
      facet-def:
        facet: models.particles.facets.RangeQueryFacet
        field: metadata.number_of_events
        label:
          en: Number of events
          cs: Počet událostí

    dataset_type:
      type: keyword
      label:
        en: Dataset Type
      enum:
        - simulated
        - collision
        - logbook
        - manual