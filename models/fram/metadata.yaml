#Metadata model, FRAM

Metadata:
  properties:

    experiment:
      type: vocabulary
      vocabulary-type: experiments
      label:
        en: Experiment
        cs: Experiment

    # Identification

    target_id:
      type: int
      label:
        en: Identifier
        cs: Identifikátor
      description: >
        Integer identifier.
      example: 241


    target_name:
      type: keyword
      label:
        en: Target
        cs: Objekt
      example: "VAOD_color"
    
      
    observation_type:
      type: keyword
      label:
        en: Observation type
        cs: Typ pozorování
      example: "flat"
      


    # Temporal
     
    observation_time:
      type: datetime
      label:
        en: Observation time
        cs: Čas pozorování
      description: >
        UTC date and time of observation (ISO 8601 format).
      example: "2017-04-06T22:26:22Z"

    
    observation_night:
      type: keyword
      label:
        en: Observation night
        cs: Noc pozorování
      description: >
        Local date of the observation night in YYYYMMDD format.
      pattern: '^[0-9]{8}$'
      example: "20170406"

       
    exposure_time:
      type: float
      label:
        en: Exposure
        cs: Expozice
      description: >
        Exposure duration in seconds.
      example: 30.0


      
    # Coordinates

    center:
      type: object
      label:
        en: Center coordinates
        cs: Souřadnice středu
      properties:
        ra:
          type: float
          label:
            en: RA
            cs: RA
        dec:
          type: float
          label:
            en: Dec
            cs: Dec
      description: >
        Celestial coordinates [RA, Dec] in degrees.

    radius:
      type: float
      label:
        en: Radius
        cs: Poloměr

    altitude_azimuth:
      type: object
      label:
        en: Altitude-Azimuth
        cs: Altituda-Azimut
      properties:
        altitude:
          type: float
          label:
            en: Altitude
            cs: Altituda
        azimuth:
          type: float
          label:
            en: Azimuth
            cs: Azimut
      description: >
        Horizontal coordinates [Alt, Az] in degrees.
      example: {"altitude": 45.3680630043068, "azimuth": 89.3656649605622 }
       
    # Instrument configuration
    
    site:
      type: keyword
      label:
        en: Observatory site
        cs: Místo pozorování
      example: "auger2"
   
    ccd:
      type: keyword
      label:
        en: CCD type
        cs: Typ CCD
      example: "NF3"

               
    camera_serial:
      type: keyword
      label:
        en: Camera serial number
        cs: Sériové číslo kamery
      example: "2328"

         
    filter:
      type: keyword
      label:
        en: Filter
        cs: Filtr
      example: "DF"

             
    binning:
      type: keyword
      label:
        en: Binning
        cs: Binning
      description: >
        Pixel binning configuration (horizontal x vertical).
      pattern: '^[0-9]+x[0-9]+$'
      example: "1x1"

                 
    detector_size:
      type: object
      label:
        en: Size
        cs: Rozměry
      properties:
        width:
          type: int
          label:
            en: Width (physical)
            cs: Šířka (fyzická)
        height:
          type: int
          label:
            en: Height (physical)
            cs: Výška (fyzická)
        usable_width:
          type: int
          label:
            en: Width (usable)
            cs: Šířka (použitelná)
        usable_height:
          type: int
          label:
            en: Height (usable)
            cs: Výška (použitelná)
      description: >
        Dimensions in unbinned pixels. Physical size refers to the full chip,
        usable size to the effective imaging area.
      example: {"width": 4144, "height": 4127, "usable_width": 4096, "usable_height": 4096}

                  
    file_types:
      type: array
      label:
        en: File types
        cs: Typy souborů
      items:
        type: keyword


    filename:
      type: keyword
      label:
        en: Filename
        cs: Název souboru
      example: "/mnt/data2/cta-s0/2017/20170813/02001/WF0/20170814041208-419-RA.fits"
 
    footprint:
      type: keyword
      label:
        en: Footprint
        cs: Pokrytí oblohy
