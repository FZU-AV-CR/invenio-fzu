#Metadata model, FRAM

Metadata:
  properties:

    experiment:
      type: vocabulary
      vocabulary-type: experiments
      label:
        en: Experiment
        cs: Experiment

    # Identification

    identifier:
      type: int
      label:
        en: Identifier
        cs: Identifikátor
      description: >
        Integer identifier.
      example: 241


    target:
      type: keyword
      label:
        en: Target
        cs: Objekt
      example: "VAOD_color"
      facet-def:
        facet: models.fram.facets.TextMatchFacet
        field: metadata.target
        label:
          en: Target
          cs: Objekt


      
    type:
      type: keyword
      label:
        en: Type
        cs: Typ
      example: "flat"
      


    # Temporal
     
    observation_time:
      type: datetime
      label:
        en: Observation time
        cs: Čas pozorování
      description: >
        UTC date and time of observation (ISO 8601 format).
      example: "2017-04-06T22:26:22Z"

    
    observation_night:
      type: keyword
      label:
        en: Observation night
        cs: Noc pozorování
      description: >
        Local date of the observation night in YYYYMMDD format.
        Uses a custom RangeQueryFacet (see facets.py) instead of the
        default TermsFacet so the UI can filter by a "YYYYMMDD..YYYYMMDD"
        range string -- YYYYMMDD sorts lexicographically the same as
        numerically, so a plain OpenSearch range query works directly on
        this keyword field without needing a real `date` type.
      pattern: '^[0-9]{8}$'
      example: "20170406"
      facet-def:
        facet: models.fram.facets.RangeQueryFacet
        field: metadata.observation_night
        label:
          en: Observation night
          cs: Noc pozorování



       
    exposure:
      type: float
      label:
        en: Exposure
        cs: Expozice
      description: >
        Exposure duration in seconds.
      example: 30.0
      facet-def:
        facet: models.fram.facets.RangeQueryFacet
        field: metadata.exposure
        label:
          en: Exposure
          cs: Expozice



      
    # Coordinates

    center:
      type: object
      label:
        en: Center
        cs: Střed
      properties:
        ra:
          type: float
          label:
            en: RA
            cs: RA
        dec:
          type: float
          label:
            en: Dec
            cs: Dec
      description: >
        Celestial coordinates [RA, Dec].

    radius:
      type: float
      label:
        en: Radius
        cs: Poloměr

    # NOTE: this object is deliberately named "alt_az" and NOT
    # "altitude_azimuth". oarepo_model's ObjectDataType.get_facet() builds
    # facet paths using a buggy `path.endswith(key)` check that is meant to
    # detect "the child key is already the same as the parent path" (to
    # avoid double-appending), but it actually matches whenever the PARENT
    # path merely *ends with* the child key as a substring. Since
    # "altitude_azimuth" ends with the substring "azimuth", the azimuth
    # child's facet path was incorrectly built as "altitude_azimuth" (missing
    # ".azimuth") instead of "altitude_azimuth.azimuth" -- silently breaking
    # the azimuth range facet (filter accepted with 200 OK, but had zero
    # effect since the registered facet key never matched the query param).
    # Renaming the parent object to "alt_az" avoids the collision entirely.
    alt_az:
      type: object
      label:
        en: Altitude-Azimuth
        cs: Altituda-Azimut
      properties:
        altitude:
          type: float
          label:
            en: Altitude
            cs: Altituda
          facet-def:
            facet: models.fram.facets.RangeQueryFacet
            field: metadata.alt_az.altitude
            label:
              en: Altitude
              cs: Altituda
        azimuth:
          type: float
          label:
            en: Azimuth
            cs: Azimut
          facet-def:
            facet: models.fram.facets.RangeQueryFacet
            field: metadata.alt_az.azimuth
            label:
              en: Azimuth
              cs: Azimut


      description: >
        Horizontal coordinates [Alt, Az]. altitude/azimuth use a custom
        RangeQueryFacet (see facets.py) instead of the default TermsFacet,
        so the UI can filter by arbitrary "min..max" ranges rather than
        exact-match only.
      example: {"altitude": 45.3680630043068, "azimuth": 89.3656649605622 }

       
    # Instrument configuration
    
    site:
      type: keyword
      label:
        en: Observatory site
        cs: Místo pozorování
      example: "auger2"
   
    ccd:
      type: keyword
      label:
        en: CCD
        cs: CCD
      example: "NF3"

               
    camera_serial:
      type: keyword
      label:
        en: Camera serial
        cs: Sériové číslo kamery
      example: "2328"

         
    filter:
      type: keyword
      label:
        en: Filter
        cs: Filtr
      example: "DF"

             
    binning:
      type: keyword
      label:
        en: Binning
        cs: Binning
      description: >
        Pixel binning configuration (horizontal x vertical).
      pattern: '^[0-9]+x[0-9]+$'
      example: "1x1"

                 
    image_size:
      type: object
      label:
        en: Image size
        cs: Rozměry snímku
      properties:
        width:
          type: int
          label:
            en: Width (physical)
            cs: Šířka (fyzická)
        height:
          type: int
          label:
            en: Height (physical)
            cs: Výška (fyzická)
        usable_width:
          type: int
          label:
            en: Width (usable)
            cs: Šířka (použitelná)
        usable_height:
          type: int
          label:
            en: Height (usable)
            cs: Výška (použitelná)
      description: >
        Physical size refers to the full chip,
        usable size to the effective imaging area.
      example: {"width": 4144, "height": 4127, "usable_width": 4096, "usable_height": 4096}

                  
    file_types:
      type: array
      label:
        en: File types
        cs: Typy souborů
      items:
        type: keyword


    filename:
      type: keyword
      label:
        en: Filename
        cs: Název souboru
      example: "/mnt/data2/cta-s0/2017/20170813/02001/WF0/20170814041208-419-RA.fits"
      facet-def:
        facet: models.fram.facets.TextMatchFacet
        field: metadata.filename
        label:
          en: Filename
          cs: Název souboru


    footprint:
      type: dynamic-object
      searchable: false
      label:
        en: Footprint
        cs: Pokrytí oblohy
      description: >
        Optional. GeoJSON polygon of image corners, for OpenSearch geo_shape
        indexing. Used internally for second-pass position re-checking only
        — not displayed in the UI. Computed from WCS corner pixels. RA
        remapped to −180..+180°. Null for calibration frames
        (masterdark/masterflat/bias/dcurrent) or frames without valid WCS.
        Uses oarepo's built-in `dynamic-object` type (accepts any nested
        JSON object with a permissive marshmallow schema) rather than the
        regular `object` type, because `object` requires a fixed
        `properties` schema and cannot express GeoJSON's variable-depth
        nested coordinate arrays. The default OpenSearch mapping for
        `dynamic-object` (`{"type": "object", "dynamic": "true"}`) is
        overridden to `geo_shape` via `PatchIndexPropertyMapping` in
        model.py. `searchable: false` because oarepo's default keyword
        facet/search logic does not apply to geo_shape fields; use
        dedicated geo queries instead.




    # ── Spherical index (sky position search) ──────────────────────────────
    # center_geo requires geo_point OpenSearch mapping from Cesnet.
    # healpix_idx is a plain integer — no special mapping needed.
    # Both are null for calibration frames which have no sky position.

    center_geo:
      type: object
      label:
        en: Center (geo index)
        cs: Střed (geo index)
      description: >
        Shadow field for OpenSearch geo_point indexing.
        RA remapped from 0–360° to −180..+180° (lon); Dec unchanged (lat).
        Must be a separate field from center.ra/center.dec because the
        coordinate systems differ (0–360 vs −180..+180).
        Null for calibration frames.
      properties:
        lat:
          type: float
          label:
            en: Latitude (Dec)
            cs: Zeměpisná šířka
        lon:
          type: float
          label:
            en: Longitude (RA remapped)
            cs: Zeměpisná délka

    healpix_idx:
      type: int
      label:
        en: HEALPix pixel index
        cs: HEALPix pixel index
      description: >
        HEALPix NSIDE=64 pixel index of image center.
        Used for sky-region faceting and fallback cone search.
        Null for calibration frames.
      example: 12345

