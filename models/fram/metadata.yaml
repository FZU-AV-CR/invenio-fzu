Metadata:
  properties:
     
    # Identification

    target_id:
      type: int
      label:
        en: Target identifier
        cs: Identifikátor cíle
      description: >
        Integer identifier of the target.
      example: 241


    target_name:
      type: keyword
      label:
        en: Target name
        cs: Název objektu
      example: "VAOD_color"
    
      
    observation_type:
      type: keyword
      label:
        en: Observation type
        cs: Typ pozorování
      example: "flat"
      


    # Temporal
     
    observation_time:
      type: datetime
      label:
        en: Observation time
        cs: Čas pozorování
      description: >
        UTC date and time of observation (ISO 8601 format).
      example: "2017-04-06T22:26:22Z"

    
    observation_night:
      type: keyword
      label:
        en: Observation night
        cs: Noc pozorování
      description: >
        Local date of the observation night in YYYYMMDD format.
      pattern: '^[0-9]{8}$'
      example: 20170406

       
    exposure_time:
      type: float
      label:
        en: Exposure time
        cs: Doba expozice
      description: >
        Exposure duration in seconds.
      example: 30.0


      
    # Coordinates

    center:
      type: object
      label:
        en: Center coordinates
        cs: Souřadnice středu
      properties:
        ra:
          type: float
          label:
            en: RA
            cs: RA
        dec:
          type: float
          label:
            en: Dec
            cs: Dec
      description: >
        Celestial coordinates [RA, Dec] in degrees.

    radius:
      type: float
      label:
        en: Radius
        cs: Poloměr

    altitude_azimuth:
      type: object
      label:
        en: Altitude-Azimuth
        cs: Altituda-Azimut
      properties:
        altitude:
          type: float
          label:
            en: Altitude
            cs: Altituda
        azimuth:
          type: float
          label:
            en: Azimuth
            cs: Azimut
      description: >
        Horizontal coordinates [Alt, Az] in degrees.
      example: {"altitude": 45.3680630043068, "azimuth": 89.3656649605622 }
       
    # Instrument configuration
    
    site:
      type: keyword
      label:
        en: Observatory site
        cs: Místo pozorování
      example: "auger2"
   
    ccd:
      type: keyword
      label:
        en: CCD type
        cs: Typ CCD
      example: "NF3"

               
    camera_serial:
      type: keyword
      label:
        en: Camera serial number
        cs: Sériové číslo kamery
      example: "2328"

         
    filter:
      type: keyword
      label:
        en: Optical filter
        cs: Optický filtr
      example: "DF"

             
    binning:
      type: keyword
      label:
        en: Binning
        cs: Binning
      description: >
        Pixel binning configuration (horizontal x vertical).
      pattern: '^[0-9]+x[0-9]+$'
      example: "1x1"

                 
    detector_size:
      type: object
      label:
        en: Detector size
        cs: Rozměry detektoru
      properties:
        width:
          type: int
          label:
            en: Width
            cs: Šířka
        height:
          type: int
          label:
            en: Height
            cs: Výška
      description: >
        Detector dimensions in unbinned pixels.
      example: {"width": 4096, "height": 4096}

                  
    file_types:
      type: array
      label:
        en: File types
        cs: Typy souborů
      items:
        type: keyword


    filepath:
      type: keyword
      label:
        en: Filepath
        cs: Cesta k souboru
      example: "/mnt/data2/cta-s0/2017/20170813/02001/WF0/20170814041208-419-RA.fits"

    footprint:
      type: keyword
      label:
        en: Footprint
        cs: Pokrytí oblohy

    experiment:
      type: keyword
      label:
        en: Experiment
        cs: Experiment
      enum:
        - FRAM